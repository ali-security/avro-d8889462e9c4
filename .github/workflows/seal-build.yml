# Seal: build-and-pack only. Upstream ships no GitHub Actions workflows; the
# Java test suite runs on the Travis legs (.travis.yml). This job builds the
# avro module's main and tests jars the same way release does (mvn package)
# and uploads them.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Maven 3.9.4
        run: |
          curl -sSL https://archive.apache.org/dist/maven/maven-3/3.9.4/binaries/apache-maven-3.9.4-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.4/bin" >> "$GITHUB_PATH"
      - name: Package avro jars
        working-directory: lang/java
        run: |
          echo 'Packaging only: the Java test suite runs on the Travis JAVA=8/JAVA=11 legs (.travis/script.sh).'
          mvn -version
          mvn -B -ntp package -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -pl avro -am
          ls -l avro/target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: avro-jars
          path: |
            lang/java/avro/target/avro-1.10.2.jar
            lang/java/avro/target/avro-1.10.2-tests.jar
          if-no-files-found: error
